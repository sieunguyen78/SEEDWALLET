<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ví Hạt Mầm – Chia sẻ yêu thương</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:system-ui,sans-serif;background:#f4faf7;color:#193d36}.panel{background:white;border:1px solid #dcece5;border-radius:24px;padding:24px;box-shadow:0 8px 28px #194a3210}.btn{border-radius:14px;padding:11px 18px;font-weight:700;background:#168568;color:white}.btn:hover{filter:brightness(.94)}.secondary{background:#e8f5ee;color:#17684f}.field{width:100%;border:1px solid #c9ded4;border-radius:12px;padding:11px;background:white}.nav{padding:10px 14px;border-radius:12px;font-weight:650}.nav.active{background:#d9f4e6;color:#14694f}.pill{border-radius:999px;background:#edf8f1;padding:5px 12px;font-size:12px;font-weight:700;color:#217253}#toast{position:fixed;bottom:20px;right:20px;z-index:90}.hidden{display:none!important}</style></head><body><div id="app"></div><div id="toast"></div><script>
'use strict';
const KEY='vhm_demo_v3';const seed=()=>({users:[],categories:[{id:'an',name:'Bữa sáng căn tin',limit:30000,quota:50},{id:'hoc',name:'Dụng cụ học tập',limit:50000,quota:30},{id:'xe',name:'Vé xe buýt',limit:20000,quota:40},{id:'sach',name:'Sách tham khảo',limit:80000,quota:20}],packages:[],surveys:[],logs:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}let session=JSON.parse(sessionStorage.getItem('vhm_session')||'null'),tab='home',authMode='login',authRole='student',selectedPackage=null,chart=null;const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join("");const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const me=()=>db.users.find(u=>u.id===session?.id);const isAdmin=()=>session?.role==='admin';const category=id=>db.categories.find(c=>c.id===id);const fmt=n=>new Intl.NumberFormat('vi-VN').format(n)+' đ';const date=t=>new Date(t).toLocaleString('vi-VN');function notify(t,ok=true){$('#toast').innerHTML=`<div class="rounded-2xl shadow-xl p-4 ${ok?'bg-emerald-700':'bg-rose-700'} text-white">${esc(t)}</div>`;setTimeout(()=>$('#toast')&&($('#toast').innerHTML=''),3500)}function celebrate(){if(window.confetti)confetti({particleCount:90,spread:70,origin:{y:.7}})}function icon(n){return `<i data-lucide="${n}" class="w-5 h-5 inline-block align-middle"></i>`}function paint(){const app=$('#app');app.innerHTML=`<header class="bg-white/95 border-b border-emerald-100 sticky top-0 z-30"><div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-3"><div class="bg-emerald-100 text-emerald-700 p-3 rounded-2xl">${icon('sprout')}</div><div><h1 class="text-xl font-black">Ví Hạt Mầm</h1><p class="text-xs text-slate-500">Gieo yêu thương • Giữ trọn riêng tư</p></div></div><div class="flex items-center gap-2">${session?`<span class="text-sm text-slate-600">${isAdmin()?'Giáo viên quản trị':esc(me()?.name||'Học sinh')}</span><button class="btn secondary" onclick="logout()">Đăng xuất</button>`:`<span class="pill">Không cần công khai danh tính</span>`}</div></div></header><main class="max-w-6xl mx-auto px-4 py-7">${!session?authView():isAdmin()?adminView():studentView()}</main><footer class="max-w-6xl mx-auto px-4 pb-8 text-center text-xs text-slate-500">Bản mô phỏng nghiên cứu • Dữ liệu lưu trên trình duyệt này • Không dùng cho giao dịch thật</footer>`;lucide.createIcons();if(session&&isAdmin()&&tab==='stats')drawCharts();if(selectedPackage)showQR(selectedPackage)}
function authView(){return `<section class="grid md:grid-cols-2 gap-7 items-center"><div class="space-y-5"><span class="pill">Không ai bị bỏ lại phía sau</span><h2 class="text-4xl md:text-5xl font-black leading-tight">Một hạt mầm nhỏ.<br><span class="text-emerald-600">Một niềm vui lớn.</span></h2><p class="text-slate-600 text-lg">Cùng xây dựng trường học tử tế, nơi việc sẻ chia diễn ra kín đáo, công bằng và đầy tôn trọng.</p><div class="grid grid-cols-2 gap-3"><div class="panel">${icon('shield-check')}<p class="font-bold mt-2">Riêng tư hai chiều</p><p class="text-sm text-slate-500">Không hiển thị người gieo và người nhận</p></div><div class="panel">${icon('heart-handshake')}<p class="font-bold mt-2">Chia sẻ nhẹ nhàng</p><p class="text-sm text-slate-500">Nhận hỗ trợ không áp lực</p></div></div></div><div class="panel"><h2 class="text-2xl font-black mb-4">${authMode==='login'?'Chào mừng trở lại':'Tạo tài khoản học sinh'}</h2><div class="flex gap-2 mb-5"><button class="btn ${authRole==='student'?'':'secondary'} flex-1" onclick="authRole='student';paint()">Học sinh</button><button class="btn ${authRole==='admin'?'':'secondary'} flex-1" onclick="authRole='admin';authMode='login';paint()">Giáo viên / Quản trị</button></div><form onsubmit="authenticate(event)" class="space-y-3">${authMode==='register'&&authRole==='student'?`<label class="block text-sm font-bold">Họ và tên<input class="field mt-1" name="name" required maxlength="80" autocomplete="name"></label><label class="block text-sm font-bold">Lớp<input class="field mt-1" name="class" required placeholder="Ví dụ: 8/1" maxlength="15"></label>`:''}<label class="block text-sm font-bold">${authRole==='admin'?'Tên đăng nhập quản trị':'Mã học sinh'}<input class="field mt-1" name="code" required maxlength="40" autocomplete="username"></label><label class="block text-sm font-bold">${authRole==='admin'?'Mật khẩu':'Mã PIN 4 chữ số'}<input class="field mt-1" name="pin" required type="password" ${authRole==='student'?'pattern="[0-9]{4}" inputmode="numeric" maxlength="4"':''} autocomplete="current-password"></label><button class="btn w-full" type="submit">${authMode==='login'?'Đăng nhập':'Đăng ký'}</button></form>${authRole==='student'?`<button class="text-emerald-700 font-semibold mt-4" onclick="authMode=authMode==='login'?'register':'login';paint()">${authMode==='login'?'Chưa có tài khoản? Đăng ký':'Đã có tài khoản? Đăng nhập'}</button>`:''}<p class="text-xs text-slate-500 mt-5">Tài khoản quản trị thử nghiệm: <b>giaovien</b> / <b>HatMam@2026!</b>. Không sử dụng thông tin thật.</p></div></section>`}
async function digest(s){const bytes=new TextEncoder().encode(s);const hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function authenticate(e){e.preventDefault();const f=new FormData(e.target),code=String(f.get('code')).trim(),pin=String(f.get('pin'));if(authRole==='admin'){if(code==='giaovien'&&pin==='HatMam@2026!'){session={role:'admin'};sessionStorage.setItem('vhm_session',JSON.stringify(session));tab='home';paint()}else notify('Thông tin đăng nhập không chính xác',false);return}if(!/^\d{4}$/.test(pin)){notify('Mã PIN phải gồm đúng 4 chữ số',false);return}const hash=await digest(code+':'+pin);if(authMode==='register'){if(db.users.some(u=>u.code===code)){notify('Mã học sinh đã được sử dụng',false);return}const name=String(f.get('name')).trim(),klass=String(f.get('class')).trim();if(!name||!klass||!code){notify('Vui lòng điền đủ thông tin',false);return}const user={id:uid(),code,name,class:klass,pinHash:hash,active:true,eligible:false,created:Date.now()};db.users.push(user);save();session={role:'student',id:user.id};sessionStorage.setItem('vhm_session',JSON.stringify(session));tab='home';notify('Đăng ký thành công!');paint();celebrate()}else{const u=db.users.find(u=>u.code===code&&u.pinHash===hash);if(!u){notify('Mã học sinh hoặc PIN không đúng',false);return}if(!u.active){notify('Tài khoản đang tạm khóa',false);return}session={role:'student',id:u.id};sessionStorage.setItem('vhm_session',JSON.stringify(session));tab='home';paint()}}
function logout(){session=null;sessionStorage.removeItem('vhm_session');selectedPackage=null;tab='home';paint()}function nav(items){return `<nav class="flex flex-wrap gap-2 mb-6">${items.map(([id,label,ic])=>`<button class="nav ${tab===id?'active':''}" onclick="tab='${id}';selectedPackage=null;paint()">${icon(ic)} ${label}</button>`).join('')}</nav>`}function studentView(){const u=me();if(!u){logout();return ''}return `${nav([['home','Tổng quan','house'],['give','Gieo mầm','hand-heart'],['receive','Nhận mầm','gift'],['profile','Ví của tôi','wallet']])}${tab==='home'?`<div class="panel bg-gradient-to-br from-emerald-50 to-sky-50"><span class="pill">Xin chào, ${esc(u.name)}</span><h2 class="text-3xl font-black mt-3">Mỗi sự tử tế đều có thể nảy mầm 🌱</h2><p class="mt-2 text-slate-600">Bạn có thể gieo một phần quà hoặc nhận sự đồng hành khi cần. Không ai cần biết bạn là ai.</p><div class="flex flex-wrap gap-3 mt-5"><button class="btn" onclick="tab='give';paint()">Gieo mầm ngay</button><button class="btn secondary" onclick="tab='receive';paint()">Khám phá ví nhận mầm</button></div></div>`:tab==='give'?giveView():tab==='receive'?receiveView():profileView()}`}
function giveView(){return `<div class="panel max-w-2xl"><h2 class="text-2xl font-black mb-2">Gieo một hạt mầm yêu thương</h2><p class="text-slate-500 mb-5">Phần quà được đưa vào kho chung, không gắn tên người gửi.</p><form onsubmit="give(event)" class="space-y-4"><label class="block font-bold">Chọn gói hỗ trợ<select name="category" class="field mt-2" required>${db.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} • Tối đa ${fmt(c.limit)}</option>`).join('')}</select></label><label class="block font-bold">Lời nhắn yêu thương ẩn danh<textarea class="field mt-2" name="message" maxlength="180" rows="4" placeholder="Chúc bạn một ngày thật nhiều niềm vui!"></textarea></label><button class="btn" ${db.categories.length?'':'disabled'}>Xác nhận gieo mầm</button></form><p class="text-xs text-slate-500 mt-4">Đây là phiếu hỗ trợ mô phỏng; chưa có thanh toán hoặc xác nhận tài trợ thực tế.</p></div>`}function give(e){e.preventDefault();const f=new FormData(e.target),id=String(f.get('category')),c=category(id);if(!c)return notify('Danh mục không tồn tại',false);if(db.packages.filter(p=>p.categoryId===id&&p.status!=='redeemed').length>=c.quota)return notify('Danh mục đã đạt hạn mức đang lưu hành',false);const p={id:uid(),categoryId:id,donorId:me().id,message:String(f.get('message')||'').trim(),status:'available',created:Date.now(),recipientId:null,token:null};db.packages.push(p);db.logs.push({action:'Gieo mầm',time:Date.now(),packageId:p.id});save();notify('Hạt mầm đã được gửi vào kho chung!');celebrate();tab='profile';paint()}
function receiveView(){const u=me(),available=db.packages.filter(p=>p.status==='available'&&p.donorId!==u.id);return `<div class="panel mb-5"><h2 class="text-2xl font-black">Kho hạt mầm sẻ chia</h2><p class="text-slate-500 mt-2">Mọi phần quà đều được trao đi bằng sự tôn trọng. Bạn không cần công khai lý do nhận.</p><p class="mt-3">${u.eligible?'<span class="pill">Ví đã được nhà trường kích hoạt</span>':'<span class="pill">Ví nhận chưa được kích hoạt; vui lòng liên hệ giáo viên phụ trách riêng tư</span>'}</p></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${available.length?available.map(p=>`<div class="panel"><span class="pill">Đang sẵn sàng</span><h3 class="text-lg font-black mt-3">${esc(category(p.categoryId)?.name||'Gói hỗ trợ')}</h3><p class="text-sm text-slate-500 mt-2 italic">“${esc(p.message||'Chúc bạn luôn vui và vững tin!')}”</p><button class="btn mt-5 w-full" onclick="claim('${p.id}')" ${u.eligible?'':'disabled title="Ví chưa được kích hoạt"'}>Nhận hạt mầm</button></div>`).join(''):`<div class="panel col-span-full text-center py-12">${icon('sprout')}<h3 class="font-bold mt-3">Những hạt mầm mới đang trên đường tới</h3><p class="text-slate-500">Hãy quay lại sau nhé!</p></div>`}</div>`}async function claim(id){const u=me(),p=db.packages.find(x=>x.id===id);if(!u.eligible)return notify('Ví nhận chưa được kích hoạt',false);if(!p||p.status!=='available'||p.donorId===u.id)return notify('Gói này không còn khả dụng',false);if(db.packages.some(x=>x.recipientId===u.id&&x.status==='claimed'))return notify('Hãy sử dụng gói đã nhận trước khi nhận thêm',false);const pin=prompt('Nhập mã PIN 4 chữ số để xác nhận nhận mầm:');if(pin===null)return;if(await digest(u.code+':'+pin)!==u.pinHash)return notify('Mã PIN không đúng',false);p.status='claimed';p.recipientId=u.id;p.token=uid()+uid();p.claimed=Date.now();db.logs.push({action:'Nhận mầm',time:Date.now(),packageId:p.id});save();selectedPackage=p.id;tab='profile';paint();notify('Nhận mầm thành công!');celebrate()}
function profileView(){const u=me(),given=db.packages.filter(p=>p.donorId===u.id),received=db.packages.filter(p=>p.recipientId===u.id);return `<div class="grid md:grid-cols-2 gap-5"><div class="panel"><h2 class="text-xl font-black">Ví cá nhân</h2><p class="mt-3"><b>Họ tên:</b> ${esc(u.name)}</p><p><b>Lớp:</b> ${esc(u.class)}</p><p><b>Mã học sinh:</b> ${esc(u.code)}</p><p class="text-sm text-slate-500 mt-4">Thông tin này chỉ hiển thị trong phiên đăng nhập cá nhân.</p></div><div class="panel"><h2 class="text-xl font-black">Lịch sử gieo mầm</h2>${given.length?given.map(p=>`<p class="border-b py-3">${esc(category(p.categoryId)?.name||'Gói hỗ trợ')} <span class="pill">${p.status==='available'?'Đang chờ':p.status==='claimed'?'Đã được nhận':'Đã sử dụng'}</span><br><small>${date(p.created)}</small></p>`).join(''):'<p class="text-slate-500 mt-4">Chưa có hạt mầm nào được gieo.</p>'}</div><div class="panel md:col-span-2"><h2 class="text-xl font-black">Ví nhận mầm của tôi</h2>${received.length?received.map(p=>`<div class="border-b py-4"><div class="flex justify-between flex-wrap gap-3"><div><b>${esc(category(p.categoryId)?.name||'Gói hỗ trợ')}</b><p class="text-sm text-slate-500">${p.status==='redeemed'?'Đã sử dụng':'Mã dùng một lần đang có hiệu lực'}</p></div>${p.status==='claimed'?`<button class="btn secondary" onclick="selectedPackage='${p.id}';paint()">Xem mã QR</button>`:''}</div><div id="qr-${p.id}" class="mt-3"></div></div>`).join(''):'<p class="text-slate-500 mt-4">Bạn chưa nhận gói hỗ trợ nào.</p>'}</div></div>`}function showQR(id){const p=db.packages.find(x=>x.id===id);if(!p||p.recipientId!==me()?.id||p.status!=='claimed')return;const el=document.getElementById('qr-'+p.id);if(!el)return;el.innerHTML='<p class="text-sm mb-2">Xuất trình mã tại điểm đổi quà do nhà trường quy định.</p><div class="qrbox inline-block p-3 bg-white border rounded-xl"></div><p class="text-xs text-slate-500 mt-2">Không chia sẻ ảnh mã QR cho người khác.</p>';if(window.QRCode)new QRCode(el.querySelector('.qrbox'),{text:'VHM-DEMO:'+p.token,width:170,height:170});else el.querySelector('.qrbox').textContent='Mã QR cần kết nối Internet để hiển thị';selectedPackage=null}
function adminView(){return `${nav([['home','Tổng quan','layout-dashboard'],['categories','Danh mục','layers'],['members','Thành viên','users'],['redeem','Đổi quà','scan-line'],['stats','Thống kê & nghiên cứu','chart-column']])}${tab==='home'?adminHome():tab==='categories'?categoriesView():tab==='members'?membersView():tab==='redeem'?redeemView():statsView()}`}function adminHome(){const total=db.packages.length,claimed=db.packages.filter(p=>p.status==='claimed').length,redeemed=db.packages.filter(p=>p.status==='redeemed').length;return `<h2 class="text-2xl font-black mb-5">Bảng điều khiển nhà trường</h2><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">${[['Tài khoản học sinh',db.users.length],['Hạt mầm đã gieo',total],['Đang chờ sử dụng',claimed],['Đã đổi quà',redeemed]].map(([t,v])=>`<div class="panel"><p class="text-slate-500">${t}</p><p class="text-4xl font-black text-emerald-700 mt-2">${v}</p></div>`).join('')}</div><div class="panel mt-5"><h3 class="font-black text-lg">Nguyên tắc bảo mật DAPS</h3><p class="text-slate-600 mt-2">Không hiển thị cặp người gieo – người nhận. Giáo viên chỉ quản lý trạng thái, hạn mức và dữ liệu tổng hợp. Dữ liệu khảo sát trong bản này là mô phỏng, không phải kết quả nghiên cứu thực tế.</p></div>`}function categoriesView(){return `<div class="panel"><h2 class="text-2xl font-black mb-4">Quản lý danh mục hỗ trợ</h2><form class="grid md:grid-cols-4 gap-3 mb-5" onsubmit="addCategory(event)"><input name="name" class="field" placeholder="Tên gói hỗ trợ" required maxlength="80"><input name="limit" class="field" type="number" min="0" step="1000" placeholder="Giá trị tối đa (đ)" required><input name="quota" class="field" type="number" min="1" max="10000" placeholder="Hạn mức gói" required><button class="btn">Thêm danh mục</button></form><div class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="border-b"><th class="p-3">Tên danh mục</th><th class="p-3">Giá trị tối đa</th><th class="p-3">Hạn mức</th><th class="p-3">Thao tác</th></tr></thead><tbody>${db.categories.map(c=>`<tr class="border-b"><td class="p-3">${esc(c.name)}</td><td class="p-3">${fmt(c.limit)}</td><td class="p-3">${c.quota}</td><td class="p-3"><button class="text-emerald-700 font-bold mr-3" onclick="editCategory('${c.id}')">Sửa</button><button class="text-rose-700 font-bold" onclick="deleteCategory('${c.id}')">Xóa</button></td></tr>`).join('')}</tbody></table></div></div>`}function addCategory(e){e.preventDefault();const f=new FormData(e.target);db.categories.push({id:uid(),name:String(f.get('name')).trim(),limit:Number(f.get('limit')),quota:Number(f.get('quota'))});save();paint();notify('Đã thêm danh mục')}function editCategory(id){const c=category(id);if(!c)return;const name=prompt('Tên danh mục:',c.name);if(name===null||!name.trim())return;const limit=prompt('Giá trị tối đa (đ):',c.limit),quota=prompt('Hạn mức gói:',c.quota);if(limit===null||quota===null)return;if(!Number.isFinite(+limit)||+limit<0||!Number.isInteger(+quota)||+quota<1)return notify('Giá trị không hợp lệ',false);Object.assign(c,{name:name.trim(),limit:+limit,quota:+quota});save();paint()}function deleteCategory(id){if(db.packages.some(p=>p.categoryId===id))return notify('Không thể xóa danh mục đã phát sinh gói',false);if(confirm('Xóa danh mục này?')){db.categories=db.categories.filter(c=>c.id!==id);save();paint()}}
function membersView(){return `<div class="panel"><h2 class="text-2xl font-black mb-4">Quản lý thành viên</h2><p class="text-sm text-slate-500 mb-4">Chỉ giáo viên phụ trách được tiếp cận thông tin học sinh. Không công khai danh sách này.</p><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="border-b"><th class="p-3">Mã học sinh</th><th class="p-3">Họ tên</th><th class="p-3">Lớp</th><th class="p-3">Trạng thái</th><th class="p-3">Quyền nhận</th><th class="p-3">PIN</th></tr></thead><tbody>${db.users.map(u=>`<tr class="border-b"><td class="p-3">${esc(u.code)}</td><td class="p-3">${esc(u.name)}</td><td class="p-3">${esc(u.class)}</td><td class="p-3"><button class="btn secondary" onclick="toggleUser('${u.id}','active')">${u.active?'Đang hoạt động':'Tạm khóa'}</button></td><td class="p-3"><button class="btn secondary" onclick="toggleUser('${u.id}','eligible')">${u.eligible?'Đã kích hoạt':'Chưa kích hoạt'}</button></td><td class="p-3"><button class="text-emerald-700 font-bold" onclick="resetPin('${u.id}')">Đặt lại</button></td></tr>`).join('')}</tbody></table></div></div>`}function toggleUser(id,k){const u=db.users.find(x=>x.id===id);if(!u)return;u[k]=!u[k];save();paint()}async function resetPin(id){const u=db.users.find(x=>x.id===id);if(!u)return;const pin=prompt('Nhập PIN mới gồm đúng 4 chữ số:');if(pin===null)return;if(!/^\d{4}$/.test(pin))return notify('PIN không hợp lệ',false);u.pinHash=await digest(u.code+':'+pin);save();notify('Đã cập nhật PIN trong bản thử nghiệm')}
function redeemView(){return `<div class="panel max-w-xl"><h2 class="text-2xl font-black">Điểm đổi quà Hạt Mầm</h2><p class="text-slate-500 my-3">Nhập chuỗi mã lấy từ QR để xác nhận sử dụng một lần. Không yêu cầu tên học sinh.</p><form onsubmit="redeem(event)" class="space-y-3"><input class="field" name="token" placeholder="Dán nội dung mã QR" required><button class="btn">Xác nhận đổi quà</button></form></div>`}function redeem(e){e.preventDefault();const token=String(new FormData(e.target).get('token')).trim().replace(/^VHM-DEMO:/,'');const p=db.packages.find(x=>x.token===token);if(!p)return notify('Mã không hợp lệ',false);if(p.status!=='claimed')return notify('Mã đã sử dụng hoặc không còn hiệu lực',false);p.status='redeemed';p.redeemed=Date.now();db.logs.push({action:'Đổi quà',time:Date.now(),packageId:p.id});save();paint();notify('Đổi quà thành công!');celebrate()}
function statsView(){return `<h2 class="text-2xl font-black mb-4">Thống kê & báo cáo nghiên cứu</h2><div class="grid md:grid-cols-2 gap-5"><div class="panel"><h3 class="font-black mb-3">Tình trạng hạt mầm</h3><div class="h-64"><canvas id="statusChart"></canvas></div></div><div class="panel"><h3 class="font-black mb-3">Số lượng theo danh mục</h3><div class="h-64"><canvas id="categoryChart"></canvas></div></div><div class="panel md:col-span-2"><h3 class="font-black mb-2">Khảo sát trước – sau (dữ liệu mô phỏng)</h3><p class="text-sm text-slate-500 mb-3">Điểm trung bình trên thang 1–5; các giá trị dưới đây là dữ liệu minh họa được gắn nhãn rõ ràng, không được sử dụng như bằng chứng thực nghiệm.</p><div class="h-64"><canvas id="researchChart"></canvas></div></div></div><div class="panel mt-5"><h3 class="font-black mb-3">Xuất dữ liệu quản trị</h3><div class="flex flex-wrap gap-3"><button class="btn" onclick="exportCSV('summary')">Xuất tổng hợp CSV</button><button class="btn secondary" onclick="exportCSV('research')">Xuất khảo sát mô phỏng CSV</button></div><p class="text-xs text-slate-500 mt-3">Báo cáo tổng hợp không chứa tên, mã học sinh hoặc liên kết người gieo – người nhận.</p></div>`}function drawCharts(){if(!window.Chart)return;const counts=[db.packages.filter(p=>p.status==='available').length,db.packages.filter(p=>p.status==='claimed').length,db.packages.filter(p=>p.status==='redeemed').length];const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}};new Chart($('#statusChart'),{type:'doughnut',data:{labels:['Chưa nhận','Đã nhận','Đã sử dụng'],datasets:[{data:counts,backgroundColor:['#a7e6c2','#80c5ee','#278b70']}]},options:opts});new Chart($('#categoryChart'),{type:'bar',data:{labels:db.categories.map(c=>c.name),datasets:[{label:'Số gói',data:db.categories.map(c=>db.packages.filter(p=>p.categoryId===c.id).length),backgroundColor:'#51b995'}]},options:opts});new Chart($('#researchChart'),{type:'bar',data:{labels:['Mặc cảm xã hội (thấp là tốt)','Lòng tự trọng','Hành vi nhân ái'],datasets:[{label:'Trước can thiệp – minh họa',data:[3.7,2.6,2.4],backgroundColor:'#91b7da'},{label:'Sau can thiệp – minh họa',data:[2.2,3.8,4.1],backgroundColor:'#55b992'}]},options:{...opts,scales:{y:{min:0,max:5}}}})}function exportCSV(type){let rows;if(type==='research'){rows=[['Chỉ số','Trước can thiệp (mô phỏng)','Sau can thiệp (mô phỏng)'],['Mặc cảm xã hội',3.7,2.2],['Lòng tự trọng',2.6,3.8],['Hành vi nhân ái',2.4,4.1]]}else{rows=[['Danh mục','Đã gieo','Chưa nhận','Đã nhận','Đã sử dụng'],...db.categories.map(c=>{const a=db.packages.filter(p=>p.categoryId===c.id);return[c.name,a.length,a.filter(p=>p.status==='available').length,a.filter(p=>p.status==='claimed').length,a.filter(p=>p.status==='redeemed').length]})]}const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=type==='research'?'khao_sat_mo_phong.csv':'tong_hop_hat_mam.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}paint();
</script></body></html>
